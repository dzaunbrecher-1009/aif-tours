<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall Donor Visits</title>
<meta name="description" content="Tell us who you are, then pick which upcoming visit you'd like to join.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6f5c'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">

<a class="skip" href="#picker">Skip to the options</a>

<header class="hero" id="hero">
  <div class="wrap">
    <img class="logo" id="logo" src="" alt="" hidden>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="headline"></h1>
    <p class="intro" id="intro"></p>
  </div>
</header>

<main class="wrap">
  <section id="picker" aria-labelledby="picker-h">
    <h2 id="picker-h" class="section-h"></h2>
    <p class="section-sub" id="picker-sub"></p>
    <div class="roles" id="roles" role="list"></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p><span id="closing"></span> <a id="contact" href="#"></a></p>
  </div>
</footer>

<div class="boot-error" id="boot-error" hidden>
  <div>
    <h2>The page couldn't load its content.</h2>
    <p id="boot-msg"></p>
    <p class="boot-hint">This almost always means <code>content.json</code> has a typo. Ask Claude to check it.</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
